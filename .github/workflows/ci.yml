name: ci
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

env:
  GHIDRA_INSTALL_DIR: /home/runner/ghidra

jobs:
  build_and_test:
    name: Build + test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - ghidra_version: "12.1.3"
            ghidra_build_date: "20260817"
            ghidra_sha256: "93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54"
    env:
      GHIDRA_VERSION: ${{ matrix.ghidra_version }}
      GHIDRA_BUILD_DATE: ${{ matrix.ghidra_build_date }}
      GHIDRA_SHA256: ${{ matrix.ghidra_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: 'temurin'
          java-version: '21.0.12'
          cache: 'gradle'
      - name: Inexpensive Python and shell checks
        run: python3 tools/check.py
      - name: Install Ghidra
        run: .github/scripts/install_ghidra.sh
      - name: Reproducible build, installed lifecycle and actual database migration
        run: bash .github/scripts/validate.sh
      - name: Preserve reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-reports
          path: build/reports

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GhidraBoy_Ghidra_${{ matrix.ghidra_version }}
          path: build/distributions/
          if-no-files-found: 'error'
